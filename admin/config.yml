backend:
  name: github
  repo: Nothypaa/Rambo-coaching
  branch: main
  # Sign in with a GitHub access token ("Se connecter avec un jeton d'accès").
  # There is no OAuth server: the old /api/auth + /api/callback pair handed the
  # GitHub token to any page that asked for it, and was removed.

# Where images uploaded through the CMS are stored / referenced from, unless
# the field sets its own media_folder. Image values must start with "/":
# Sveltia CMS reads a path without one as relative to the JSON file, and then
# can't find the image to preview it.
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

site_url: https://rambo-coaching.vercel.app
locale: "fr"

collections:
  - name: "transformations"
    label: "Nos Transformations (photos)"
    files:
      - name: "gallery"
        label: "Galerie de photos"
        file: "data/gallery.json"
        editor:
          preview: false
        fields:
          - label: "Photos"
            name: "images"
            label_singular: "Photo"
            widget: "list"
            summary: "{{fields.image}}"
            fields:
              - { label: "Image", name: "image", widget: "image", media_folder: "/assets/images/gallery" }

  - name: "profile"
    label: "À propos (parcours, chiffres, médailles)"
    files:
      - name: "profile"
        label: "Profil de Paul"
        file: "data/profile.json"
        editor:
          preview: false
        fields:
          - label: "Photo"
            name: "photo"
            widget: "object"
            fields:
              - { label: "Image", name: "image", widget: "image", media_folder: "/assets/images" }
              - { label: "Texte alternatif", name: "alt", widget: "string" }
          - label: "Parcours"
            name: "bio"
            label_singular: "Section"
            widget: "list"
            summary: "{{fields.heading}}"
            fields:
              - { label: "Titre", name: "heading", widget: "string" }
              - { label: "Texte", name: "text", widget: "text" }
          - label: "Chiffres clés"
            name: "stats"
            label_singular: "Chiffre"
            widget: "list"
            summary: "{{fields.value}} {{fields.label}}"
            fields:
              - { label: "Icône", name: "image", widget: "image", media_folder: "/assets/icon" }
              - { label: "Nombre", name: "value", widget: "string" }
              - { label: "Libellé", name: "label", widget: "string" }
          - { label: "Titre du palmarès", name: "palmaresTitle", widget: "string" }
          - label: "Icônes de médaille"
            name: "medalIcons"
            widget: "object"
            fields:
              - label: "Or"
                name: "or"
                widget: "object"
                fields:
                  - { label: "Icône", name: "image", widget: "image", media_folder: "/assets/icon" }
                  - { label: "Texte alternatif", name: "alt", widget: "string" }
              - label: "Argent"
                name: "argent"
                widget: "object"
                fields:
                  - { label: "Icône", name: "image", widget: "image", media_folder: "/assets/icon" }
                  - { label: "Texte alternatif", name: "alt", widget: "string" }
          # Les totaux or/argent affichés en haut du palmarès sont comptés
          # automatiquement à partir de cette liste.
          - label: "Palmarès"
            name: "palmares"
            label_singular: "Titre"
            widget: "list"
            summary: "{{fields.title}} — {{fields.category}} ({{fields.year}})"
            fields:
              - label: "Médaille"
                name: "rank"
                widget: "select"
                options:
                  - { label: "Or", value: "or" }
                  - { label: "Argent", value: "argent" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Catégorie", name: "category", widget: "string" }
              - { label: "Année", name: "year", widget: "string" }

  - name: "tarifs"
    label: "Tarifs (offres et prix)"
    files:
      - name: "offers"
        label: "Offres"
        file: "data/offers.json"
        description: >-
          Les offres affichées dans « Tarifs ». Pour une formule annuelle, saisis
          seulement le prix par mois et le prix pour l'année : le prix barré,
          l'économie et l'équivalent par mois sont calculés automatiquement.
        editor:
          preview: false
        fields:
          - label: "Offres"
            name: "offers"
            label_singular: "Offre"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Nom de l'offre", name: "name", widget: "string" }
              - label: "Précision après le nom"
                name: "nameDetail"
                widget: "string"
                required: false
                hint: "Affichée en plus petit à côté du nom, ex. « (non compétition) ». Optionnel."
              - { label: "Description", name: "description", widget: "text" }
              - label: "Couleur de la carte"
                name: "style"
                widget: "select"
                default: "light"
                options:
                  - { label: "Blanche", value: "light" }
                  - { label: "Rouge", value: "red" }
              - label: "Prix par mois (€)"
                name: "monthlyPrice"
                widget: "number"
                value_type: "int"
                min: 1
                required: false
                hint: "Laisse vide pour afficher un texte à la place du prix (champ suivant)."
              - label: "Texte à la place du prix"
                name: "priceText"
                widget: "string"
                required: false
                hint: "Affiché seulement si le prix par mois est vide, ex. « Formule sur-mesure »."
              - label: "Prix pour l'année, payée en une fois (€)"
                name: "annualPrice"
                widget: "number"
                value_type: "int"
                min: 1
                required: false
                hint: "Optionnel. Laisse vide s'il n'y a pas de formule annuelle."
              - label: "Petite note sous le prix"
                name: "note"
                widget: "string"
                required: false
                hint: "Ex. « *Engagement initial de 3 mois, puis reconduction mensuelle. » Optionnel."
              - label: "Ce qui est inclus"
                name: "features"
                label_singular: "Élément"
                widget: "list"
                field: { label: "Élément", name: "feature", widget: "string" }
              - label: "Option"
                name: "option"
                widget: "object"
                required: false
                collapsed: true
                hint: "Optionnel, ex. l'option nutrition. Laisse le texte vide pour ne rien afficher."
                fields:
                  - { label: "Nom de l'option", name: "label", widget: "string", required: false }
                  - { label: "Texte", name: "text", widget: "text", required: false }
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
                media_folder: "/assets/images"
                hint: "Avec une photo, l'offre s'affiche en grand sur la première ligne. Sans photo, sur la deuxième ligne."
              - label: "Description de la photo"
                name: "imageAlt"
                widget: "string"
                required: false
                hint: "Pour Google : décris ce qu'on voit sur la photo."

  - name: "instagram"
    label: "Publications Instagram"
    files:
      - name: "instagram"
        label: "Feed Instagram"
        file: "data/instagram.json"
        editor:
          preview: false
        fields:
          - label: "Publications"
            name: "posts"
            label_singular: "Publication"
            widget: "list"
            summary: "{{fields.image}}"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - label: "Lien vers la publication"
                name: "link"
                widget: "string"
                required: false
                hint: "Colle l'URL de la publication Instagram (optionnel)"
