<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Rambo Coaching — Administration</title>
  <!-- Absolute path: Vercel's clean URLs serve this page at /admin (no
       trailing slash), which would make a relative "config.yml" resolve
       to /config.yml (404) instead of /admin/config.yml. -->
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
  <!-- Brand-color override for the admin UI (top nav + sidebar). See the
       file for how these hooks were found and why they're safe to rely on. -->
  <link rel="stylesheet" href="/admin/admin-styles.css">
</head>
<body>
  <!-- Decap CMS — the admin panel. Config is loaded from /admin/config.yml.
       Pinned to an exact version (not a "^" range) so a new Decap release
       can never silently break this panel again — 3.15.0 shipped with a
       same-day list-widget crash (decaporg/decap-cms#7906–#7913); 3.14.0
       is the last version before that regression. Bump this deliberately
       after checking release notes, not automatically. -->
  <script src="https://unpkg.com/decap-cms@3.14.0/dist/decap-cms.js"></script>
</body>
</html>
